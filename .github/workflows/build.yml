name: Build APK
run-name: "🔨 Сборка APK Apps"

on:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив проекта в корень
        run: |
          set -e
          # В корне репозитория лежит только этот workflow + архив проекта (*.zip, имя любое).
          ARCH=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ARCH" ]; then
            echo "::error::Не найден архив проекта (*.zip) в корне репозитория"; exit 1
          fi
          echo "Распаковываю $ARCH"
          unzip -o -q "$ARCH" -d _extracted
          # ищем package.json; если в архиве лежит вложенный zip проекта (репо-архив целиком) — распаковываем и его
          SRC=""
          for pass in 1 2 3; do
            INNER=$(find _extracted -maxdepth 1 -mindepth 1 -type d ! -name ".github" | head -1)
            if [ -f _extracted/package.json ]; then SRC=_extracted; break; fi
            if [ -n "$INNER" ] && [ -f "$INNER/package.json" ]; then SRC="$INNER"; break; fi
            NZ=$(find _extracted -maxdepth 2 -name '*.zip' | head -1)
            if [ -z "$NZ" ]; then break; fi
            echo "Вложенный архив: $NZ — распаковываю"
            mkdir -p _ex2 && unzip -o -q "$NZ" -d _ex2 && rm -rf _extracted && mv _ex2 _extracted
          done
          if [ -z "$SRC" ]; then echo "::error::В архиве нет package.json — не тот архив?"; exit 1; fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            [ "$name" = ".github" ] && continue
            rm -rf "./$name"
            cp -r "$item" "./$name"
          done
          shopt -u dotglob
          rm -rf _extracted
          rm -f "$ARCH"
          if [ ! -f package.json ]; then echo "::error::package.json не появился после распаковки"; exit 1; fi
          echo "=== корень после распаковки ===" && ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: |
          set -e
          rm -rf android            # снести любую старую платформу — иначе cap add пропустит свежую сборку
          rm -f capacitor.config.ts # на всякий случай убрать старый TS-конфиг (в архиве только JSON)
          npx cap add android
          npx cap copy android      # принудительно скопировать свежий web-бандл (dist) в ассеты
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
          } >> android/gradle.properties
          # версия приложения из package.json: versionName = X.YYY, versionCode = XYYY
          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.001")
          VCODE=$(echo "$VER" | tr -d '.')
          GRV=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VCODE/" "$GRV"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$GRV"
          grep -nE "versionCode|versionName" "$GRV" || true

      - name: Generate app icons
        run: |
          # Рендерим icon.svg в icon.png через sharp
          if [ -f resources/icon.svg ]; then
            npm i -g sharp-cli >/dev/null 2>&1 || npm i sharp >/dev/null 2>&1 || true
            node -e "const s=require('sharp');s('resources/icon.svg',{density:300}).resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('svg->png ok')).catch(e=>{console.log('render skip:',e.message)})" || echo "sharp render skipped, using existing icon.png"
          fi
          npx @capacitor/assets generate --android --assetPath resources

      - name: Add Android permissions
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q "QUERY_ALL_PACKAGES" "$MAN"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n\n    <application#' "$MAN"
          fi
          # старый back-callback, чтобы кнопка/жест «Назад» доходили до приложения
          sed -i 's#<application #<application android:enableOnBackInvokedCallback="false" #' "$MAN"
          # FileProvider для «Поделиться» APK
          if ! grep -q "appsfp" "$MAN"; then
            sed -i 's#</application>#    <provider android:name="leshugan.ma.AppsFileProvider" android:authorities="${applicationId}.appsfp" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/apps_file_paths" /></provider>\n    </application>#' "$MAN"
          fi
          echo "----- manifest -----"
          grep -E "uses-permission|appsfp" "$MAN" || true

      - name: Install native Apps plugin
        run: |
          set -e
          PKG=android/app/src/main/java/leshugan/ma
          mkdir -p "$PKG" android/app/src/main/res/xml
          # копируем ВСЕ java из native/ — чтобы новые файлы не приходилось вписывать сюда руками
          for f in native/*.java; do
            cp "$f" "$PKG/$(basename "$f")"
          done
          cp native/apps_file_paths.xml android/app/src/main/res/xml/apps_file_paths.xml
          # переопределяем пути провайдера Capacitor (.fileprovider) на наши,
          # чтобы шаринг получал доступ к кэшу через уже зарегистрированный провайдер
          cp native/apps_file_paths.xml android/app/src/main/res/xml/file_paths.xml
          echo "native files:" && ls -la "$PKG"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/uc.jks" \
            -Pandroid.injected.signing.store.password="updatechecker" \
            -Pandroid.injected.signing.key.alias="uc" \
            -Pandroid.injected.signing.key.password="updatechecker"

      - name: Upload APK (артефакт)
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Apps_Compiled
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 5

      - name: Выложить APK в релиз (если квота артефактов исчерпана)
        if: steps.upload_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          TAG=apk-latest
          NOTES="Автосборка #${{ github.run_number }} от $(date -u +'%Y-%m-%d %H:%M UTC') — выложено в релиз, т.к. квота артефактов исчерпана."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" --title "Apps_Compiled" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          echo "::notice::Квота артефактов исчерпана — APK в релизе $TAG"

  cleanup:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old runs and APKs (keep last 10 successful)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          WF=build.yml
          echo "Оставляем 10 последних успешных запусков:"
          KEEP=$(gh run list --repo "$REPO" --workflow "$WF" --status success --limit 10 --json databaseId --jq '.[].databaseId')
          echo "$KEEP"
          echo "Удаляем остальные запуски и их APK:"
          gh run list --repo "$REPO" --workflow "$WF" --limit 300 --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if ! printf '%s\n' "$KEEP" | grep -qx "$id"; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "удалён $id" || true
            fi
          done
